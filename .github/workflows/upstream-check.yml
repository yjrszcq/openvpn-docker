name: Upstream Check

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      pr_created: ${{ steps.discover.outputs.pr_created }}
      pr_url: ${{ steps.discover.outputs.pr_url }}
      version: ${{ steps.discover.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: discover
        name: Discover and propose the latest official OpenVPN release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -a
          . ./versions.env
          set +a
          scripts/verify-release-metadata.sh >/dev/null
          latest_tag="$(gh api repos/OpenVPN/openvpn/releases/latest --jq .tag_name)"
          target="${latest_tag#v}"
          if ! [[ "$target" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected official release tag: $latest_tag" >&2
            exit 1
          fi
          if [ "$target" = "$OPENVPN_VERSION" ] || [ "$(printf '%s\n%s\n' "$OPENVPN_VERSION" "$target" | sort -V | tail -n 1)" != "$target" ]; then
            echo "no newer official OpenVPN release than $OPENVPN_VERSION"
            exit 0
          fi
          policy="$(
            scripts/release-policy.sh \
              --previous-version "$OPENVPN_VERSION" \
              --target-version "$target" \
              --candidate-range "$OPENVPN_CANDIDATE_RANGE" \
              --image-version "$IMAGE_VERSION"
          )"
          if ! grep -Fqx 'in_range=true' <<<"$policy"; then
            echo "latest OpenVPN $target is outside candidate range $OPENVPN_CANDIDATE_RANGE"
            exit 0
          fi
          branch="automation/openvpn-$target"
          if [ "$(gh pr list --head "$branch" --state open --json url --jq length)" -gt 0 ]; then
            echo "open update pull request already exists for $target"
            exit 0
          fi
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/OpenVPN/openvpn/releases/download/v$target/openvpn-$target.tar.gz"
          source_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          scripts/update-openvpn.sh "$target" "$source_sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add versions.env compatibility/contract.json
          git commit -m "build: update OpenVPN to $target"
          git push origin "$branch"
          pr_url="$(
            gh pr create \
              --base dev \
              --head "$branch" \
              --title "build: update OpenVPN to $target" \
              --body "Updates versions.env and the compatibility contract for the official OpenVPN $target release and its SHA-256. Candidate and compatibility workflows must pass before promotion."
          )"
          {
            echo 'pr_created=true'
            echo "pr_url=$pr_url"
            echo "version=$target"
          } >> "$GITHUB_OUTPUT"

  notify:
    name: Send Gotify upstream-check notification
    needs: discover
    if: needs.discover.outputs.pr_created == 'true'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@main
    with:
      title: ${{ format('{0} 发现 OpenVPN {1}', github.repository, needs.discover.outputs.version) }}
      message: |
        已成功创建新版本更新 PR。
        OpenVPN 版本：${{ needs.discover.outputs.version }}
        PR 地址：${{ needs.discover.outputs.pr_url }}
        运行详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      priority: 5
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}
