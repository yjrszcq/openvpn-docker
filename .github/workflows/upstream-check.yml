name: Upstream Check

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_created: ${{ steps.discover.outputs.pr_created }}
      pr_url: ${{ steps.discover.outputs.pr_url }}
      version: ${{ steps.discover.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: discover
        name: Discover and propose the latest official OpenVPN release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -a
          . ./versions.env
          set +a
          scripts/verify-release-metadata.sh >/dev/null
          latest_tag="$(gh api repos/OpenVPN/openvpn/releases/latest --jq .tag_name)"
          target="${latest_tag#v}"
          if ! [[ "$target" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected official release tag: $latest_tag" >&2
            exit 1
          fi
          if [ "$target" = "$OPENVPN_VERSION" ] || [ "$(printf '%s\n%s\n' "$OPENVPN_VERSION" "$target" | sort -V | tail -n 1)" != "$target" ]; then
            echo "no newer official OpenVPN release than $OPENVPN_VERSION"
            exit 0
          fi
          policy="$(
            scripts/release-policy.sh \
              --previous-version "$OPENVPN_VERSION" \
              --target-version "$target" \
              --candidate-range "$OPENVPN_CANDIDATE_RANGE" \
              --image-version "$IMAGE_VERSION"
          )"
          if ! grep -Fqx 'in_range=true' <<<"$policy"; then
            echo "latest OpenVPN $target is outside candidate range $OPENVPN_CANDIDATE_RANGE"
            exit 0
          fi
          branch="automation/openvpn-$target"
          if [ "$(gh pr list --head "$branch" --state open --json url --jq length)" -gt 0 ]; then
            echo "open update pull request already exists for $target"
            exit 0
          fi
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/OpenVPN/openvpn/releases/download/v$target/openvpn-$target.tar.gz"
          source_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          scripts/update-openvpn.sh "$target" "$source_sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add versions.env compatibility/contract.json
          git commit -m "build: update OpenVPN to $target"
          git push origin "$branch"
          pr_url="$(
            gh pr create \
              --base dev \
              --head "$branch" \
              --title "build: update OpenVPN to $target" \
              --body "Updates versions.env and the compatibility contract for the official OpenVPN $target release and its SHA-256. Candidate and compatibility workflows must pass before promotion."
          )"
          {
            echo 'pr_created=true'
            echo "pr_url=$pr_url"
            echo "version=$target"
          } >> "$GITHUB_OUTPUT"

  notify-discovered:
    name: Notify that a new upstream version was found
    needs: discover
    if: needs.discover.outputs.pr_created == 'true'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@main
    with:
      title: ${{ format('{0} 发现 OpenVPN 上游新版本 {1}', github.repository, needs.discover.outputs.version) }}
      message: |
        已成功创建新版本更新 PR。
        OpenVPN 版本：${{ needs.discover.outputs.version }}
        PR 地址：${{ needs.discover.outputs.pr_url }}
        运行详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      priority: 5
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}

  candidate-context:
    name: Read candidate validation context
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'automation/openvpn-')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.context.outputs.version }}
    steps:
      - id: context
        name: Read OpenVPN version from the automation branch
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="${HEAD_BRANCH#automation/openvpn-}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected automation branch: $HEAD_BRANCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  notify-candidate-success:
    name: Notify that candidate validation passed
    needs: candidate-context
    if: >-
      always() &&
      needs.candidate-context.result == 'success' &&
      github.event.workflow_run.conclusion == 'success'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@main
    with:
      title: ${{ format('{0} OpenVPN {1} 候选版本验证通过', github.repository, needs.candidate-context.outputs.version) }}
      message: |
        候选版本验证通过。
        OpenVPN 版本：${{ needs.candidate-context.outputs.version }}
        来源分支：${{ github.event.workflow_run.head_branch }}
        验证详情：${{ github.event.workflow_run.html_url }}
      priority: 5
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}

  notify-candidate-failure:
    name: Notify that candidate validation failed
    needs: candidate-context
    if: >-
      always() &&
      needs.candidate-context.result == 'success' &&
      github.event.workflow_run.conclusion != 'success'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@main
    with:
      title: ${{ format('{0} OpenVPN {1} 候选版本验证失败', github.repository, needs.candidate-context.outputs.version) }}
      message: |
        候选版本验证未通过。
        OpenVPN 版本：${{ needs.candidate-context.outputs.version }}
        验证结果：${{ github.event.workflow_run.conclusion }}
        来源分支：${{ github.event.workflow_run.head_branch }}
        验证详情：${{ github.event.workflow_run.html_url }}
      priority: 8
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}
